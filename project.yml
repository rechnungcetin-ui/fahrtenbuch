name: Fahrtenbuch
options:
  bundleIdPrefix: de.meinfahrtenbuch
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: de
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.2"
    CURRENT_PROJECT_VERSION: "3"
targets:
  Fahrtenbuch:
    type: application
    platform: iOS
    sources:
      - Fahrtenbuch
    scheme: {}
    entitlements:
      path: Fahrtenbuch/Fahrtenbuch.entitlements
      properties:
        aps-environment: development
        com.apple.developer.icloud-container-identifiers:
          - iCloud.de.meinfahrtenbuch.app
        com.apple.developer.ubiquity-container-identifiers:
          - iCloud.de.meinfahrtenbuch.app
        com.apple.developer.icloud-services:
          - CloudKit
          - CloudDocuments
        com.apple.developer.ubiquity-kvstore-identifier: $(TeamIdentifierPrefix)$(CFBundleIdentifier)
    info:
      path: Fahrtenbuch/Info.plist
      properties:
        CFBundleDisplayName: Fahrtenbuch
        CFBundleDevelopmentRegion: de
        UILaunchScreen: {}
        ITSAppUsesNonExemptEncryption: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIBackgroundModes:
          - location
          - remote-notification
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        NSUbiquitousContainers:
          iCloud.de.meinfahrtenbuch.app:
            NSUbiquitousContainerIsDocumentScopePublic: true
            NSUbiquitousContainerName: Fahrtenbuch
            NSUbiquitousContainerSupportedFolderLevels: Any
        NSLocationWhenInUseUsageDescription: "Das Fahrtenbuch zeichnet deine Route und die gefahrenen Kilometer auf."
        NSLocationAlwaysAndWhenInUseUsageDescription: "Damit Fahrten automatisch aufgezeichnet werden, sobald du losfährst – auch wenn die App geschlossen ist – braucht das Fahrtenbuch den Standortzugriff „Immer“."
        NSCalendarsFullAccessUsageDescription: "Schlägt den Reisezweck aus deinen Kalenderterminen vor – passend zu Ankunftszeit und Zielort."
        NSMotionUsageDescription: "Erkennt anhand der Bewegung, dass du im Auto sitzt, und startet die Aufzeichnung automatisch."
        NSCameraUsageDescription: "Zum Scannen von Tank- und Werkstattbelegen."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.meinfahrtenbuch.app
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_PREVIEWS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
